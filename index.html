<style>
/* Layout: 6 صفحات أفقية بخلفيات ملونة + شريط تبويب سفلي + شاشة إعدادات مستقلة + ورقة سفلية للتواصل */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14203a; --muted:#66718a; --line:#d9dfea; --accent:#1f6feb; --scrim:rgba(10,18,36,.5);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--surface:#17213a;--ink:#e8edf7;--muted:#93a0bb;--line:#26324f;--accent:#5b9bff;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--surface:#17213a;--ink:#e8edf7;--muted:#93a0bb;--line:#26324f;--accent:#5b9bff;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
.page .pin{padding-top:calc(14px + env(safe-area-inset-top,0px))}
html,body{height:100%}
body{background:#0d1526;color:var(--ink);font-family:var(--body);direction:rtl;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:var(--body)}
.app{height:100%;display:flex;flex-direction:column}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;color:#fff;background-size:cover;background-position:center;position:relative}
.page::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.2));pointer-events:none}
.pin{position:relative;max-width:560px;margin:0 auto;padding:0 16px;padding-block:14px 30px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.top h2{font-family:var(--display);font-size:1.75rem;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.top small{display:block;font-size:.8rem;opacity:.85;margin-top:2px;font-family:var(--body);font-weight:500}
.tools{display:flex;gap:8px}
.gbtn{border:0;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:500 .88rem var(--body);height:38px;min-width:38px;padding:0 14px;border-radius:999px;cursor:pointer;display:grid;place-items:center}
.gbtn.on{background:#fff;color:#14203a}
.gbtn svg{width:20px;height:20px;fill:currentColor}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.tile{all:unset;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;min-width:0}
.av{width:100%;max-width:76px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.55rem var(--display);background-size:cover;background-position:center;box-shadow:0 5px 14px rgba(0,0,0,.25);transition:transform .15s;border:2px solid rgba(255,255,255,.35)}
.tile:active .av{transform:scale(.92)}
.nm{font-size:.8rem;font-weight:600;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.add .av{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.55);box-shadow:none;font-size:1.8rem;font-weight:500}
.editing .tile:not(.add) .av{animation:wob .3s infinite alternate}
.editing .tile:not(.add)::after{content:"✎";position:absolute;top:-4px;left:4px;background:#fff;color:#14203a;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.editing .tile .av{animation:none}}
.rd{background:rgba(0,0,0,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:10px 12px 12px;margin-bottom:22px}
.rdh{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;margin-bottom:8px}
.rdh span{display:flex;align-items:center;gap:6px}
.rdh svg{width:16px;height:16px;fill:currentColor}
.rdclr{border:0;background:rgba(255,255,255,.16);color:#fff;font:500 .75rem var(--body);padding:4px 10px;border-radius:999px;cursor:pointer}
.rdl{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rdl::-webkit-scrollbar{display:none}
.rdi{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;text-decoration:none;min-width:0}
.rdav{position:relative;width:50px}
.rdav .av{width:50px;max-width:50px;font-size:1.1rem;border-width:1.5px}
.rdav i{position:absolute;bottom:-3px;left:-3px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid rgba(0,0,0,.35)}
.rdav i svg{width:12px;height:12px;fill:currentColor}
.rdi b{font-size:.74rem;font-weight:600;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdi small{font-size:.66rem;opacity:.75}
.rdempty{margin:0;font-size:.78rem;opacity:.8}
.empty{text-align:center;opacity:.85;font-size:.85rem;margin-top:26px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#0b1222}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:#9aa6c0;font:500 .82rem var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab i{width:8px;height:8px;border-radius:50%;display:block}
.tab.cur{background:rgba(255,255,255,.1);color:#fff}
.gbtn:focus-visible,.tile:focus-visible,.opt:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.who .av{width:56px;max-width:56px;font-size:1.3rem;border:0}
.who b{font-family:var(--display);font-size:1.2rem;display:block}
.who span{color:var(--muted);font-size:.85rem;direction:ltr;display:inline-block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:.78rem;font-weight:500;cursor:pointer;border:0;background:none;padding:0}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff}
.ic svg{width:26px;height:26px;fill:currentColor}
.opt.off{opacity:.3}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.row .btn{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--body);padding:9px 14px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#d23b3b}
label.l{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
input.f,select.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:1rem var(--body)}
input.ltr,textarea.ltr{direction:ltr;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.colors button.sel{border-color:var(--ink)}
/* settings screen */
.settings{position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto;animation:slide .25s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.settings .pin{color:var(--ink)}
.settings h2{font-family:var(--display);font-size:1.6rem;margin:0}
.sec{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em;margin:22px 4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;color:var(--ink);font:500 .95rem var(--body);text-align:right}
.prow:last-child{border-bottom:0}
.thumb{width:44px;height:44px;border-radius:12px;background-size:cover;background-position:center;flex:0 0 auto;border:1px solid rgba(0,0,0,.08)}
.prow .grow{flex:1;min-width:0}
.prow small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.chev{color:var(--muted);font-size:1.2rem}
.bgopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgopt{aspect-ratio:3/4;border-radius:12px;border:3px solid transparent;cursor:pointer;background-size:cover;background-position:center;color:#fff;font:500 .75rem var(--body);display:flex;align-items:flex-end;justify-content:center;padding:6px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.bgopt.sel{border-color:var(--ink)}
.note{color:var(--muted);font-size:.8rem;line-height:1.6;margin:8px 4px 0}
.sic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto;font:700 1rem var(--display)}
.sic svg{width:20px;height:20px;fill:currentColor}
.fopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fopt{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:center}
.fopt b{display:block;font-size:1.25rem;font-weight:700;line-height:1.5}
.fopt small{color:var(--muted);font-size:.72rem;font-family:var(--body)}
.fopt.sel{border-color:var(--accent)}
.szs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.szs button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:700}
.szs button.sel{border-color:var(--accent)}
.prev{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;color:#fff;margin-bottom:14px}
.prev .av{width:58px;max-width:58px;border:0}
.toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#14203a;color:#fff;padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:30;white-space:nowrap}
</style>
</head>

function mix(h,t,a){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(h),B=p(t);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*a).toString(16).padStart(2,"0")).join("")}
function bgCss(p,type){type=type||p.bg;const c=p.color;
  if(type==="img"&&p.img)return`background-image:url('${p.img}')`;
  if(type==="solid")return`background:${c}`;
  if(type==="dots")return`background:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.6px) 0 0/18px 18px,linear-gradient(170deg,${mix(c,"#ffffff",.08)},${mix(c,"#000000",.45)})`;
  if(type==="glow")return`background:radial-gradient(circle at 80% 10%,${mix(c,"#ffffff",.35)},transparent 55%),radial-gradient(circle at 10% 90%,${mix(c,"#000000",.2)},transparent 60%),${mix(c,"#000000",.5)}`;
  if(type==="night")return`background:linear-gradient(180deg,#0b1222,${mix(c,"#0b1222",.35)})`;
  return`background:linear-gradient(160deg,${mix(c,"#ffffff",.15)},${mix(c,"#000000",.4)})`;
}
const BGS=[["grad","تدرج"],["solid","لون سادة"],["dots","نقاط"],["glow","توهج"],["night","ليلي"],["img","صورة"]];
const PERSON='<svg viewBox="0 0 24 24" style="width:46%;height:46%;fill:currentColor;opacity:.9"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>';

  return`<div class="av" style="background:${AV[c.color??0]}">${m?PERSON:esc((c.name||"؟").trim()[0])}</div>`}
function shrink(file,size,cb,square){const img=new Image();img.onload=()=>{const cv=document.createElement("canvas");let sx=0,sy=0,sw=img.width,sh=img.height,w,h;
  if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;w=h=size}else{const r=Math.min(1,size/Math.max(sw,sh));w=Math.round(sw*r);h=Math.round(sh*r)}
  cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,w,h);cb(cv.toDataURL("image/jpeg",.78))};img.src=URL.createObjectURL(file)}

function logUse(c,k){S.recent=(S.recent||[]).filter(r=>!(r.id===c.id&&r.k===k));S.recent.unshift({id:c.id,k,t:Date.now()});S.recent=S.recent.slice(0,12);save()}

/* ---------- contacts import ---------- */
function shrinkSrc(src,size,cb){const img=new Image();img.onload=()=>{const cv=document.createElement("canvas"),m=Math.min(img.width,img.height);cv.width=cv.height=size;cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);cb(cv.toDataURL("image/jpeg",.78))};img.onerror=()=>cb("");img.src=src}
function parseVcf(text){
  const out=[];text=text.replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"");
  text.split(/BEGIN:VCARD/i).slice(1).forEach(card=>{
    const o={};card.split("\n").forEach(l=>{const i=l.indexOf(":");if(i<0)return;const key=l.slice(0,i).toUpperCase(),val=l.slice(i+1).trim();
      const qp=/QUOTED-PRINTABLE/.test(key);const dec=v=>{if(!qp)return v;try{return decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,"%$1"))}catch(e){return v}};
      if(/^(ITEM\d+\.)?FN\b/.test(key)&&!o.name)o.name=dec(val);
      else if(/^(ITEM\d+\.)?N\b/.test(key)&&!o.n)o.n=dec(val).split(";").filter(Boolean).reverse().join(" ");
      else if(/^(ITEM\d+\.)?TEL\b/.test(key)&&!o.phone)o.phone=val.replace(/^tel:/i,"").replace(/[^\d+]/g,"");
      else if(/^PHOTO/.test(key)&&!o.photo){if(/^https?:/.test(val))return;const t=(key.match(/TYPE=([A-Z]+)/)||[,"JPEG"])[1].toLowerCase();o.photo=val.startsWith("data:")?val:"data:image/"+t+";base64,"+val}});
    o.name=o.name||o.n||"";if(o.name||o.phone)out.push(o)});
  return out;
}
function pickContacts(multi,cb){
  if("contacts" in navigator&&navigator.contacts.select){
    navigator.contacts.select(["name","tel","icon"],{multiple:multi}).then(async res=>{
      const list=[];for(const r of res){const o={name:(r.name||[])[0]||"",phone:String((r.tel||[])[0]||"").replace(/[^\d+]/g,"")};
        if(r.icon&&r.icon[0])o.photo=await new Promise(ok=>shrinkSrc(URL.createObjectURL(r.icon[0]),160,ok));list.push(o)}
      if(list.length)cb(list)}).catch(()=>vcfPick(cb));
    return}
  vcfPick(cb);
}
function vcfPick(cb){
  let inp=$("#vcfIn");if(!inp){inp=document.createElement("input");inp.type="file";inp.id="vcfIn";inp.accept=".vcf,text/vcard,text/x-vcard";inp.multiple=true;inp.hidden=true;document.body.appendChild(inp)}
  inp.value="";inp.onchange=async()=>{let list=[];for(const f of inp.files){list=list.concat(parseVcf(await f.text()))}
    if(!list.length)return toast("ما لقيت أسماء في الملف");
    for(const o of list)if(o.photo)o.photo=await new Promise(ok=>shrinkSrc(o.photo,160,ok));
    cb(list)};
  if(!("contacts" in navigator))vcfHelp(()=>inp.click());else inp.click();
}

   <div class="card"><button class="prow" type="button" id="fontRow"><span class="sic" style="background:#7a45a8">ع</span><span class="grow">الخطوط<small>${(FONTS.find(x=>x[0]===(S.ui||{}).font)||FONTS[0])[1]}</small></span><span class="chev">‹</span></button>
    <button class="prow" type="button" id="sizeRow"><span class="sic" style="background:#c27a1f"><svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4zm-6 8h3v7h3v-7h3V9H3z"/></svg></span><span class="grow">حجم الخط<small>${(SIZES.find(x=>x[0]===(S.ui||{}).size)||SIZES[1])[1]}</small></span><span class="chev">‹</span></button>
    <button class="prow" type="button" id="rdRow"><span class="sic" style="background:#2f7d5b">${REDIAL}</span><span class="grow">خانة إعادة الاتصال<small>${(S.ui||{}).redial===false?"مخفية":"ظاهرة"} — اضغط للتبديل</small></span><span class="chev">${(S.ui||{}).redial===false?"○":"●"}</span></button>
    <button class="prow" type="button" id="hideRow"><span class="sic" style="background:#3d4a63">${EYEOFF}</span><span class="grow">إخفاء الأسماء<small>${hid()?"مفعّل — الأسماء والصور مخفية":"غير مفعّل"} — اضغط للتبديل</small></span><span class="chev">${hid()?"●":"○"}</span></button></div>
   <div class="sec">جهات الاتصال</div>
   <div class="card"><button class="prow" type="button" id="impRow"><span class="sic" style="background:#2fa84f">${PERSON}</span><span class="grow">استيراد من جهات الاتصال<small>أضف أسماء من جوالك دفعة وحدة</small></span><span class="chev">‹</span></button></div>
   <div class="sec">النسخ الاحتياطي</div>
   <div class="card"><button class="prow" type="button" id="bkOut"><span class="grow">نسخ بياناتي<small>انسخ النص واحفظه في الملاحظات</small></span></button>
    <button class="prow" type="button" id="bkIn"><span class="grow">استرجاع من نسخة<small>الصق النص المحفوظ</small></span></button></div>
   <div class="sec">عام</div>
   <div class="card"><button class="prow" type="button" id="rst"><span class="grow" style="color:#d23b3b">إعادة التطبيق للبداية<small>يحذف كل الأسماء (${total}) والصفحات</small></span></button></div>
   <p class="note">البيانات محفوظة على هذا الجهاز فقط. خذ نسخة احتياطية قبل مسح بيانات المتصفح.</p>
  </div>`;
  el.hidden=false;
  $("#sClose").onclick=()=>{el.hidden=true;render();goTo(cur)};
  el.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>pageForm(+b.dataset.pe));
  $("#fontRow").onclick=fontSheet;$("#sizeRow").onclick=sizeSheet;
  $("#hideRow").onclick=()=>{S.ui=S.ui||{};S.ui.hide=!S.ui.hide;save();settings();toast(S.ui.hide?"تم إخفاء الأسماء":"الأسماء ظاهرة")};
  $("#impRow").onclick=()=>pickContacts(true,list=>importSheet(list));
  $("#rdRow").onclick=()=>{S.ui=S.ui||{};S.ui.redial=S.ui.redial===false;save();settings();toast(S.ui.redial?"خانة إعادة الاتصال ظاهرة":"تم إخفاء الخانة")};
  $("#bkOut").onclick=()=>{const t=JSON.stringify(S);open(`<b style="font-family:var(--display);font-size:1.1rem">نسخة بياناتك</b><p class="note">انسخ النص كاملاً واحفظه في مكان آمن.</p><textarea class="f ltr" id="bkT" rows="6" readonly>${esc(t)}</textarea><div class="row"><button class="btn pri" type="button" id="bkC">نسخ</button><button class="btn" type="button" id="cn">إغلاق</button></div>`);
    $("#cn").onclick=close;$("#bkC").onclick=()=>{const ta=$("#bkT");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("تم النسخ"),()=>{ta.select();toast("حدد النص وانسخه")})}};
  $("#bkIn").onclick=()=>{open(`<b style="font-family:var(--display);font-size:1.1rem">استرجاع نسخة</b><p class="note">الصق النص اللي حفظته سابقاً. سيستبدل البيانات الحالية.</p><textarea class="f ltr" id="bkT" rows="6"></textarea><div class="row"><button class="btn pri" type="button" id="bkR">استرجاع</button><button class="btn" type="button" id="cn">إلغاء</button></div>`);
    $("#cn").onclick=close;$("#bkR").onclick=()=>{try{const d=JSON.parse($("#bkT").value);if(!Array.isArray(d.pages)||!Array.isArray(d.contacts))throw 0;S=d;save();applyUI();close();settings();toast("تم الاسترجاع")}catch(e){toast("النص غير صحيح — تأكد أنك نسخته كاملاً")}}};
  $("#rst").onclick=e=>{const b=e.currentTarget;if(b.dataset.sure){S=defaults();save();applyUI();cur=0;settings();toast("تمت الإعادة")}else{b.dataset.sure=1;b.querySelector(".grow").firstChild.textContent="اضغط مرة ثانية للتأكيد"}};
}
function preview(){const p=S.pages[cur]||S.pages[0];const c=S.contacts[0]||{name:"سالم",color:0};
  return`<div class="prev" style="${bgCss(p)};background-size:cover">${avatar(c)}<div><div style="font:700 1.4rem var(--display)">${esc(p.name)}</div><div style="font:600 .85rem var(--body)">${esc(c.name)}</div></div></div>`}
function fontSheet(){
  S.ui=S.ui||{};
  const draw=()=>{layer.querySelector("#pvw").innerHTML=preview();layer.querySelectorAll(".fopt").forEach(b=>b.classList.toggle("sel",b.dataset.f===(S.ui.font||"plex")))};
  open(`<b style="font-family:var(--display);font-size:1.2rem">الخطوط</b><p class="note">اختر الخط اللي يعجبك، ويتغير فوراً.</p><div id="pvw" style="margin-top:12px"></div>
   <div class="fopts">${FONTS.map(f=>`<button type="button" class="fopt" data-f="${f[0]}"><b style="font-family:${f[2]},sans-serif">اتصال سريع</b><small>${f[1]}</small></button>`).join("")}</div>
   <div class="row"><button class="btn pri" type="button" id="cn">تم</button></div>`);
  draw();
  layer.querySelectorAll(".fopt").forEach(b=>b.onclick=()=>{S.ui.font=b.dataset.f;applyUI();save();draw()});
  $("#cn").onclick=()=>{close();settings()};
}
function sizeSheet(){
  S.ui=S.ui||{};
  const draw=()=>{layer.querySelector("#pvw").innerHTML=preview();layer.querySelectorAll(".szs button").forEach(b=>b.classList.toggle("sel",+b.dataset.s===(S.ui.size||1)))};
  open(`<b style="font-family:var(--display);font-size:1.2rem">حجم الخط</b><p class="note">يكبّر الأسماء والعناوين في كل الصفحات.</p><div id="pvw" style="margin-top:12px"></div>
   <div class="szs">${SIZES.map(([v,n])=>`<button type="button" data-s="${v}" style="font-size:${14*v}px">${n}</button>`).join("")}</div>
   <div class="row"><button class="btn pri" type="button" id="cn">تم</button></div>`);
  draw();
  layer.querySelectorAll(".szs button").forEach(b=>b.onclick=()=>{S.ui.size=+b.dataset.s;applyUI();save();draw()});
  $("#cn").onclick=()=>{close();settings()};
}
function pageForm(i){
  const p={...S.pages[i]};
  const draw=()=>{layer.querySelector("#pv").setAttribute("style",bgCss(p)+";height:110px;border-radius:16px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;color:#fff;font:700 1.3rem var(--display);text-shadow:0 2px 8px rgba(0,0,0,.4)");layer.querySelector("#pv").textContent=p.name||"—";
    layer.querySelectorAll(".bgopt").forEach(b=>{b.setAttribute("style",bgCss(p,b.dataset.b)+(b.dataset.b==="img"&&!p.img?";background:var(--bg);color:var(--ink);text-shadow:none":""));b.classList.toggle("sel",b.dataset.b===p.bg)});
    layer.querySelectorAll("#pcol button").forEach(b=>b.classList.toggle("sel",b.dataset.v===p.color))};
  open(`<form id="pf"><div id="pv"></div>
   <label class="l" for="p_name">اسم الصفحة</label><input class="f" id="p_name" required value="${esc(p.name)}">
   <label class="l">لون الصفحة</label><div class="colors" id="pcol">${PC.map(x=>`<button type="button" data-v="${x}" style="background:${x}" aria-label="لون"></button>`).join("")}</div>
   <label class="l">الخلفية</label><div class="bgopts">${BGS.map(([k,n])=>`<button type="button" class="bgopt" data-b="${k}">${n}</button>`).join("")}</div>
   <input type="file" id="p_img" accept="image/*" hidden>
   <div class="row"><button class="btn pri" type="submit">حفظ</button>
    ${i>0?'<button class="btn" type="button" id="pUp">تقديم الصفحة</button>':""}<button class="btn" type="button" id="cn">إلغاء</button></div></form>`);
  draw();
  $("#p_name").oninput=e=>{p.name=e.target.value;draw()};
  layer.querySelectorAll("#pcol button").forEach(b=>b.onclick=()=>{p.color=b.dataset.v;draw()});
  layer.querySelectorAll(".bgopt").forEach(b=>b.onclick=()=>{if(b.dataset.b==="img"){$("#p_img").click();return}p.bg=b.dataset.b;draw()});
  $("#p_img").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,900,u=>{p.img=u;p.bg="img";draw()})};
  $("#cn").onclick=close;
  if(i>0)$("#pUp").onclick=()=>{S.pages[i]=p;[S.pages[i-1],S.pages[i]]=[S.pages[i],S.pages[i-1]];save();close();settings();toast("تم تغيير الترتيب")};
  $("#pf").onsubmit=e=>{e.preventDefault();p.name=$("#p_name").value.trim();if(p.bg!=="img")delete p.img;S.pages[i]=p;save();close();settings();toast("تم حفظ الصفحة")};
}

try{cur=Math.min(+localStorage.getItem("sd2_cur")||0,S.pages.length-1)}catch(e){}
applyUI();render();requestAnimationFrame(()=>goTo(cur));
</script>
</body>
</html>
