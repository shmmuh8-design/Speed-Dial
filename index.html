<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="اتصال سريع">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>اتصال سريع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: شاشة واحدة، شبكة 4 أعمدة من الدوائر، ورقة سفلية لخيارات التواصل */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14203a; --muted:#66718a; --line:#d9dfea; --accent:#1f6feb; --scrim:rgba(10,18,36,.45);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--surface:#17213a;--ink:#e8edf7;--muted:#93a0bb;--line:#26324f;--accent:#5b9bff;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--surface:#17213a;--ink:#e8edf7;--muted:#93a0bb;--line:#26324f;--accent:#5b9bff;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;padding-block:14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-size:1.6rem;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.tile{all:unset;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;min-width:0}
.av{width:100%;max-width:76px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.55rem var(--display);background-size:cover;background-position:center;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .15s}
.tile:active .av{transform:scale(.92)}
.nm{font-size:.8rem;font-weight:500;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add .av{background:var(--surface);border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-size:1.8rem}
.edit-mode .tile:not(.add) .av{animation:wob .3s infinite alternate}
.edit-mode .tile:not(.add)::after{content:"✎";position:absolute;top:-4px;left:4px;background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem}
@keyframes wob{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.edit-mode .tile .av{animation:none}}
.ex{font-size:.75rem;color:var(--muted);text-align:center;margin-top:22px}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.who .av{width:56px;max-width:56px;font-size:1.3rem}
.who b{font-family:var(--display);font-size:1.2rem;display:block}
.who span{color:var(--muted);font-size:.85rem;direction:ltr;display:inline-block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:.78rem;font-weight:500;cursor:pointer;border:0;background:none;font-family:var(--body);padding:0}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff}
.ic svg{width:26px;height:26px;fill:currentColor}
.opt.off{opacity:.3}
.row{display:flex;gap:8px;margin-top:18px}
.row .btn{flex:1}
/* form */
form label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
form input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:1rem var(--body)}
form input.ltr{direction:ltr;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.sel{border-color:var(--ink)}
.danger{color:#d23b3b}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.85rem;z-index:20}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div><h1>اتصال سريع</h1><div class="sub">اضغط على الاسم واختر طريقة التواصل</div></div>
    <button class="btn" id="editBtn" type="button">تعديل</button>
  </header>
  <div class="grid" id="grid"></div>
  <p class="ex" id="exNote">الأسماء الموجودة أمثلة فقط — اضغط «تعديل» لتغييرها أو حذفها</p>
</div>
<div id="layer"></div>

<script>
const COLORS=["#c0574b","#4a7489","#c98a3a","#8a4fb8","#2f8f6b","#d26a9a","#3b5bdb","#5c6b7a"];
const SVC={
 call:{n:"اتصال",c:"#2fa84f",f:"phone",u:v=>"tel:"+v,i:'<path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>'},
 wa:{n:"واتساب",c:"#25d366",f:"phone",u:v=>"https://wa.me/"+v.replace(/\D/g,""),i:'<path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.1-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.2.3 0 .5.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.7-.9c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/>'},
 sms:{n:"رسالة",c:"#34a0f0",f:"phone",u:v=>"sms:"+v,i:'<path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7zm6 5H7v-2h6zm4-6H7V6h10z"/>'},
 fb:{n:"فيسبوك",c:"#1877f2",f:"fb",u:v=>"https://m.me/"+v,i:'<path d="M14 13.5h2.5l1-4H14v-2c0-1 0-2 2-2h1.5V2.1A21 21 0 0 0 14.6 2C12 2 10 3.7 10 6.7v2.8H7v4h3V22h4z"/>'},
 x:{n:"تويتر X",c:"#111111",f:"x",u:v=>"https://x.com/"+v,i:'<path d="M17.8 3h3.1l-6.7 7.6L22 21h-6.2l-4.8-6.3L5.5 21H2.4l7.2-8.2L2 3h6.3l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.5z"/>'},
 ig:{n:"انستقرام",c:"#d6297a",f:"ig",u:v=>"https://ig.me/m/"+v,i:'<path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM21.9 8c-.1-1.6-.4-3-1.6-4.2S17.6 2.2 16 2.1C14.4 2 9.6 2 8 2.1 6.4 2.2 5 2.5 3.8 3.7S2.2 6.4 2.1 8C2 9.6 2 14.4 2.1 16c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.6.1 6.4.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.6.1-6.4 0-8z"/>'},
 tt:{n:"تيك توك",c:"#000000",f:"tt",u:v=>"https://www.tiktok.com/@"+v,i:'<path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.8a5.7 5.7 0 1 0 4.9 5.6V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/>'},
 sc:{n:"سناب",c:"#f5c400",f:"sc",u:v=>"https://www.snapchat.com/add/"+v,i:'<path d="M12 2c3 0 5.4 2.3 5.4 5.4v2.5c.5.2 1.3.1 1.8-.2.5-.2 1 .4.6.9-.5.6-1.8.9-2.2 1.2.2 1.2 1.8 3.5 4 4.1.3.1.4.5.1.7-.7.6-2.1.6-2.4 1-.2.3-.1 1.1-.5 1.3-.6.2-1.7-.3-3.1.2-1.2.4-2 1.9-3.7 1.9s-2.5-1.5-3.7-1.9c-1.4-.5-2.5 0-3.1-.2-.4-.2-.3-1-.5-1.3-.3-.4-1.7-.4-2.4-1-.3-.2-.2-.6.1-.7 2.2-.6 3.8-2.9 4-4.1-.4-.3-1.7-.6-2.2-1.2-.4-.5.1-1.1.6-.9.5.3 1.3.4 1.8.2V7.4C6.6 4.3 9 2 12 2z"/>'}
};
const ORDER=["call","wa","sms","fb","x","ig","tt","sc"];
const FIELDS=[["phone","رقم الجوال (مع رمز الدولة)","+968 9xxxxxxx"],["fb","فيسبوك (اسم المستخدم)","username"],["x","تويتر X","username"],["ig","انستقرام","username"],["tt","تيك توك","username"],["sc","سناب شات","username"]];
const SAMPLE=[
 {name:"أبو حمد",phone:"+96890000001",x:"",ig:"",tt:"",sc:"",fb:"",color:0,ex:1},
 {name:"المكتب",phone:"+96824000000",color:1,ex:1},
 {name:"خالد",phone:"+96891000002",ig:"khalid",sc:"khalid",color:2,ex:1},
 {name:"أم سالم",phone:"+96892000003",color:5,ex:1},
 {name:"راشد",phone:"+96893000004",tt:"rashid",color:3,ex:1},
 {name:"المطبعة",phone:"+96894000005",fb:"printshop",color:4,ex:1}
];
let list, edit=false;
try{list=JSON.parse(localStorage.getItem("sd_list"))}catch(e){}
if(!Array.isArray(list))list=SAMPLE.map(o=>({...o}));
const save=()=>{try{localStorage.setItem("sd_list",JSON.stringify(list))}catch(e){}};
const $=s=>document.querySelector(s), layer=$("#layer");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=v=>String(v||"").trim().replace(/^@/,"").replace(/^https?:\/\/[^/]+\/@?/,"").replace(/\/.*$/,"");
function avatar(c){const col=COLORS[c.color??0];return c.photo?`<div class="av" style="background-image:url('${c.photo}')"></div>`:`<div class="av" style="background:${col}">${esc((c.name||"؟").trim()[0])}</div>`}
function render(){
  const g=$("#grid");g.className="grid"+(edit?" edit-mode":"");
  g.innerHTML=list.map((c,i)=>`<button class="tile" type="button" data-i="${i}">${avatar(c)}<span class="nm">${esc(c.name)}</span></button>`).join("")+
   `<button class="tile add" type="button" data-add="1"><div class="av">+</div><span class="nm">إضافة</span></button>`;
  $("#exNote").hidden=!list.some(c=>c.ex);
  $("#editBtn").textContent=edit?"تم":"تعديل";$("#editBtn").classList.toggle("on",edit);
}
$("#grid").onclick=e=>{const t=e.target.closest(".tile");if(!t)return;if(t.dataset.add)return form(-1);const i=+t.dataset.i;edit?form(i):sheet(i)};
$("#editBtn").onclick=()=>{edit=!edit;render()};
function open(html){layer.innerHTML=`<div class="scrim"><div class="sheet" role="dialog">${html}</div></div>`;layer.querySelector(".scrim").onclick=e=>{if(e.target.classList.contains("scrim"))close()}}
function close(){layer.innerHTML=""}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function sheet(i){
  const c=list[i];
  const opts=ORDER.map(k=>{const s=SVC[k],v=clean(k==="call"||k==="wa"||k==="sms"?c.phone:c[s.f]);const val=s.f==="phone"?String(c.phone||"").replace(/[^\d+]/g,""):v;
    const ic=`<span class="ic" style="background:${s.c}${k==="sc"?";color:#111":""}"><svg viewBox="0 0 24 24">${s.i}</svg></span>${s.n}`;
    return val?`<a class="opt" href="${esc(s.u(val))}" target="${k==="call"||k==="sms"?"_self":"_blank"}" rel="noopener">${ic}</a>`:`<button type="button" class="opt off" data-miss="${s.n}">${ic}</button>`}).join("");
  open(`<div class="who">${avatar(c)}<div><b>${esc(c.name)}</b><span>${esc(c.phone||"بدون رقم")}</span></div></div>
   <div class="opts">${opts}</div>
   <div class="row"><button class="btn" type="button" id="cp">نسخ الرقم</button><button class="btn" type="button" id="ed">تعديل</button></div>`);
  layer.querySelectorAll("[data-miss]").forEach(b=>b.onclick=()=>toast("أضف حساب "+b.dataset.miss+" من «تعديل»"));
  $("#ed").onclick=()=>form(i);
  $("#cp").onclick=()=>{const n=c.phone||"";if(!n)return toast("لا يوجد رقم");(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(()=>toast("تم نسخ الرقم"),()=>toast(n))};
}
function form(i){
  const c=i<0?{name:"",color:Math.floor(Math.random()*COLORS.length)}:{...list[i]};
  open(`<form id="f"><div class="who">${avatar(c)}<div><b>${i<0?"اسم جديد":"تعديل"}</b></div></div>
   <label for="f_name">الاسم</label><input id="f_name" required value="${esc(c.name)}">
   <div class="two">${FIELDS.map(([k,l,p])=>`<div${k==="phone"?' style="grid-column:1/-1"':""}><label for="f_${k}">${l}</label><input class="ltr" id="f_${k}" placeholder="${p}" inputmode="${k==="phone"?"tel":"text"}" value="${esc(c[k])}"></div>`).join("")}</div>
   <label>اللون</label><div class="colors">${COLORS.map((x,j)=>`<button type="button" data-c="${j}" class="${j===c.color&&!c.photo?"sel":""}" style="background:${x}" aria-label="لون ${j+1}"></button>`).join("")}</div>
   <label for="f_photo">صورة (اختياري)</label><input type="file" id="f_photo" accept="image/*">
   <div class="row"><button class="btn on" type="submit">حفظ</button>${i>=0?`<button class="btn danger" type="button" id="del">حذف</button>`:""}<button class="btn" type="button" id="cn">إلغاء</button></div></form>`);
  layer.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{c.color=+b.dataset.c;c.photo="";layer.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("sel",x===b))});
  $("#f_photo").onchange=e=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{const cv=document.createElement("canvas"),s=160;cv.width=cv.height=s;const m=Math.min(img.width,img.height);cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);c.photo=cv.toDataURL("image/jpeg",.8);layer.querySelector(".who .av").outerHTML=avatar(c)};img.src=URL.createObjectURL(file)};
  $("#cn").onclick=close;
  if(i>=0)$("#del").onclick=e=>{if(e.target.dataset.sure){list.splice(i,1);save();close();render();toast("تم الحذف")}else{e.target.dataset.sure=1;e.target.textContent="تأكيد الحذف"}};
  $("#f").onsubmit=e=>{e.preventDefault();c.name=$("#f_name").value.trim();FIELDS.forEach(([k])=>c[k]=k==="phone"?$("#f_"+k).value.trim():clean($("#f_"+k).value));delete c.ex;
    if(i<0)list.push(c);else list[i]=c;save();close();render();toast("تم الحفظ")};
}
render();
</script>
</body>
</html>
